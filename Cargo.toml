[package]
name = "proxy-harvester"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
