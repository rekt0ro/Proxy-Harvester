name: Validate

on:
  push:
    branches:
      - "main"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record Rust version
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Rust registry cache
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Rust build cache
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-

      - name: Format check
        run: cargo fmt --all

      - name: Run Rust tests
        run: cargo test --release --all-targets

      - name: Run Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Check whitespace
        run: git diff --check

      - name: Save Rust registry cache
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Rust build cache
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
