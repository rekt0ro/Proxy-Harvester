name: Validate

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".gitignore"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format Rust
        run: cargo fmt --all

      - name: Save formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.toml .github
          git commit -m "Format Rust sources"
          git push origin HEAD:rust-migration-review

      - name: Validate Rust
        run: cargo check --release --bins

      - name: Check whitespace
        run: git diff --check
