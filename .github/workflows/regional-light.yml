name: Update Regional Light

on:
  workflow_run:
    workflows: ["Update Configs"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: regional-light
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regional-light:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check regional probe configuration
        id: config
        env:
          REGIONAL_SSH_HOST: ${{ secrets.REGIONAL_SSH_HOST }}
          REGIONAL_SSH_USER: ${{ secrets.REGIONAL_SSH_USER }}
          REGIONAL_SSH_KEY: ${{ secrets.REGIONAL_SSH_KEY }}
          REGIONAL_SSH_KNOWN_HOSTS: ${{ secrets.REGIONAL_SSH_KNOWN_HOSTS }}
        run: |
          if [ -n "$REGIONAL_SSH_HOST" ] &&              [ -n "$REGIONAL_SSH_USER" ] &&              [ -n "$REGIONAL_SSH_KEY" ] &&              [ -n "$REGIONAL_SSH_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Regional probe is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Regional probe is not configured yet; leaving light.txt unchanged."
          fi

      - name: Explain missing regional probe
        if: steps.config.outputs.ready != 'true'
        run: |
          echo "Set REGIONAL_SSH_HOST, REGIONAL_SSH_USER, REGIONAL_SSH_KEY, and REGIONAL_SSH_KNOWN_HOSTS."
          echo "The global Light candidate pool is still produced by the normal hosted workflow."

      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        env:
          REGIONAL_SSH_KEY: ${{ secrets.REGIONAL_SSH_KEY }}
          REGIONAL_SSH_KNOWN_HOSTS: ${{ secrets.REGIONAL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$REGIONAL_SSH_KEY" > "$HOME/.ssh/regional_key"
          chmod 600 "$HOME/.ssh/regional_key"
          printf '%s\n' "$REGIONAL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preserve previous regional Light
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ -s subscriptions/light-regional.txt ]; then
            cp subscriptions/light-regional.txt /tmp/previous-regional-light.txt
          else
            : > /tmp/previous-regional-light.txt
          fi

      - name: Copy regional validation inputs
        if: steps.config.outputs.ready == 'true'
        env:
          REGIONAL_SSH_HOST: ${{ secrets.REGIONAL_SSH_HOST }}
          REGIONAL_SSH_USER: ${{ secrets.REGIONAL_SSH_USER }}
          REGIONAL_SSH_PORT: ${{ secrets.REGIONAL_SSH_PORT }}
        run: |
          ssh_port="${REGIONAL_SSH_PORT:-22}"
          remote_root="$HOME/proxy-harvester-${GITHUB_RUN_ID}"

          printf '%s\n' "$remote_root" > /tmp/regional-remote-root.txt

          ssh -i "$HOME/.ssh/regional_key"             -p "$ssh_port"             "$REGIONAL_SSH_USER@$REGIONAL_SSH_HOST"             "mkdir -p '$remote_root'"

          scp -i "$HOME/.ssh/regional_key" -P "$ssh_port"             subscriptions/all.txt             scripts/check_proxies.py             scripts/polish_light.py             /tmp/previous-regional-light.txt             "$REGIONAL_SSH_USER@$REGIONAL_SSH_HOST:$remote_root/"

      - name: Validate from Iranian regional network
        if: steps.config.outputs.ready == 'true'
        env:
          REGIONAL_SSH_HOST: ${{ secrets.REGIONAL_SSH_HOST }}
          REGIONAL_SSH_USER: ${{ secrets.REGIONAL_SSH_USER }}
          REGIONAL_SSH_PORT: ${{ secrets.REGIONAL_SSH_PORT }}
        run: |
          ssh_port="${REGIONAL_SSH_PORT:-22}"
          remote_root="$(cat /tmp/regional-remote-root.txt)"

          ssh -i "$HOME/.ssh/regional_key"             -p "$ssh_port"             "$REGIONAL_SSH_USER@$REGIONAL_SSH_HOST"             "set -eu
             command -v sing-box
             sing-box version | grep -q '1.14.2'
             python3 -m venv '$remote_root/venv'
             '$remote_root/venv/bin/python' -m pip install --disable-pip-version-check 'singbox2proxy[socks]==0.3.4'
             '$remote_root/venv/bin/python' '$remote_root/polish_light.py'                --all '$remote_root/all.txt'                --seed '$remote_root/previous-regional-light.txt'                --output '$remote_root/light-regional.next.txt'                --checker '$remote_root/check_proxies.py'                --metadata '$remote_root/light-regional-metadata.json'                --budget 4000                --workers 10                --batch-size 1                --timeout 12                --warm-timeout 5                --target-verified 200                --selection-limit 200                --final-max-per-endpoint 1                --tcp-prefilter"

      - name: Fetch regional Light result
        if: steps.config.outputs.ready == 'true'
        env:
          REGIONAL_SSH_HOST: ${{ secrets.REGIONAL_SSH_HOST }}
          REGIONAL_SSH_USER: ${{ secrets.REGIONAL_SSH_USER }}
          REGIONAL_SSH_PORT: ${{ secrets.REGIONAL_SSH_PORT }}
        run: |
          ssh_port="${REGIONAL_SSH_PORT:-22}"
          remote_root="$(cat /tmp/regional-remote-root.txt)"

          scp -i "$HOME/.ssh/regional_key" -P "$ssh_port"             "$REGIONAL_SSH_USER@$REGIONAL_SSH_HOST:$remote_root/light-regional.next.txt"             /tmp/light-regional.next.txt

          if [ -s /tmp/light-regional.next.txt ]; then
            cp /tmp/light-regional.next.txt subscriptions/light-regional.txt
            cp /tmp/light-regional.next.txt subscriptions/light.txt
            echo "Published non-empty regional Light."
          else
            echo "Regional validation produced no verified configs; preserving the previous Light pool."
          fi

      - name: Clean regional probe workspace
        if: always() && steps.config.outputs.ready == 'true'
        env:
          REGIONAL_SSH_HOST: ${{ secrets.REGIONAL_SSH_HOST }}
          REGIONAL_SSH_USER: ${{ secrets.REGIONAL_SSH_USER }}
          REGIONAL_SSH_PORT: ${{ secrets.REGIONAL_SSH_PORT }}
        run: |
          ssh_port="${REGIONAL_SSH_PORT:-22}"
          remote_root="$(cat /tmp/regional-remote-root.txt)"
          ssh -i "$HOME/.ssh/regional_key"             -p "$ssh_port"             "$REGIONAL_SSH_USER@$REGIONAL_SSH_HOST"             "rm -rf '$remote_root'" || true

      - name: Commit regional Light
        if: steps.config.outputs.ready == 'true'
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions/light.txt subscriptions/light-regional.txt

          if git diff --cached --quiet; then
            echo "No regional Light changes."
            exit 0
          fi

          git commit -m "Publish regional Light validation"
          git push
