name: Update Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-configs
  queue: single
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load sources
        env:
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
        run: |
          test -n "$PROXY_SOURCES"
          printf '%s\n' "$PROXY_SOURCES" > sources.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Cache Go build and module data
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-singbox-v1.14.2
          restore-keys: |
            ${{ runner.os }}-go-singbox-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-singbox2proxy
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache sing-box binary
        id: sing-box-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sing-box
          key: ${{ runner.os }}-sing-box-v1.14.2-with_quic-with_wireguard-with_utls-with_clash_api-with_gvisor

      - name: Install proxy tester
        run: |
          python3 -m pip install --disable-pip-version-check 'singbox2proxy[socks]'
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/sing-box" ]; then
            git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box
            TAGS="with_quic with_wireguard with_utls with_clash_api with_gvisor" make
            install -m 0755 sing-box "$HOME/.local/bin/sing-box"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sing-box" version
          "$HOME/.local/bin/sing-box" version | grep -q 'with_utls' || {
            echo "sing-box was built without with_utls"
            exit 1
          }

      - name: Check runner network
        run: |
          curl -fsS --max-time 10 https://www.gstatic.com/generate_204 -o /dev/null
          curl -fsS --max-time 10 https://api.ipify.org?format=json -o /dev/null

      - name: Build
        run: |
          # The proxy pool contains many slow-but-usable endpoints. Give the
          # Cloudflare protocol test enough time to complete handshakes, and
          # let it examine a much larger candidate pool before Light selection.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          replacements = {
              "const PROXY_TEST_LIMIT_PER_PROTOCOL: usize = 500;": "const PROXY_TEST_LIMIT_PER_PROTOCOL: usize = 3000;",
              "const PROXY_TEST_TIMEOUT_SECS: u64 = 3;": "const PROXY_TEST_TIMEOUT_SECS: u64 = 6;",
              "const PROXY_TEST_WORKERS: usize = 10;": "const PROXY_TEST_WORKERS: usize = 12;",
              "const LIGHT_CANDIDATE_BUDGET: usize = 12000;": "const LIGHT_CANDIDATE_BUDGET: usize = 30000;",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"expected source constant not found: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo build --release

      - name: Collect and test configs
        run: ./target/release/proxy-harvester

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions/ scripts/check_proxies.py .github/workflows/update.yml

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Improve proxy verification reliability"
          git push
