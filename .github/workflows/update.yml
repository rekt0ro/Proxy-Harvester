name: Update Configs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and test configs
        run: python src/main.py

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update configs"
          git push
