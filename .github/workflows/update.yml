name: Update Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load sources
        env:
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
        run: |
          test -n "$PROXY_SOURCES"
          printf '%s\n' "$PROXY_SOURCES" > sources.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust registry cache
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Resolve Throne Xray version
        id: xray-version
        shell: bash
        run: |
          set -euo pipefail

          throne_go_mod="$(curl -fsSL https://raw.githubusercontent.com/throneproj/Throne/dev/core/go.mod)"
          xray_upstream_version="$(printf '%s\n' "$throne_go_mod" | sed -n 's/^[[:space:]]*github\.com\/xtls\/xray-core[[:space:]]\+\([^[:space:]]\+\).*/\1/p' | head -n 1)"
          xray_fork_version="$(printf '%s\n' "$throne_go_mod" | sed -n 's/^[[:space:]]*replace github\.com\/xtls\/xray-core => github\.com\/throneproj\/xray-core[[:space:]]\+\([^[:space:]]\+\).*/\1/p' | head -n 1)"

          test -n "$xray_upstream_version"
          test -n "$xray_fork_version"

          echo "upstream=$xray_upstream_version" >> "$GITHUB_OUTPUT"
          echo "fork=$xray_fork_version" >> "$GITHUB_OUTPUT"

          echo "Throne Xray upstream requirement: $xray_upstream_version"
          echo "Throne Xray fork: $xray_fork_version"

      - name: Update Rust dependencies
        run: |
          set -euo pipefail
          test -f Cargo.toml
          cargo update

          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is tracked and was refreshed to the latest compatible versions."
          else
            echo "Cargo.lock created with the latest compatible versions."
          fi

      - name: Restore Rust build cache
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Xray Go cache
        id: xray-go-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-xray-${{ steps.xray-version.outputs.fork }}
          restore-keys: |
            ${{ runner.os }}-go-xray-

      - name: Restore Xray binary cache
        id: xray-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ runner.os }}-xray-${{ steps.xray-version.outputs.fork }}

      - name: Build Throne Xray core
        env:
          XRAY_UPSTREAM_VERSION: ${{ steps.xray-version.outputs.upstream }}
          XRAY_FORK_VERSION: ${{ steps.xray-version.outputs.fork }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/xray-build

          if [ ! -x "$HOME/.local/bin/xray" ]; then
            cat > /tmp/xray-build/go.mod <<EOF
          module proxy-harvester-xray

          go 1.26.0

          require github.com/xtls/xray-core $XRAY_UPSTREAM_VERSION

          replace github.com/xtls/xray-core => github.com/throneproj/xray-core $XRAY_FORK_VERSION
          EOF

            cd /tmp/xray-build
            go mod download
            go build -trimpath -buildvcs=false \
              -o "$HOME/.local/bin/xray" \
              github.com/xtls/xray-core/main
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xray" version

      - name: Save Xray Go cache
        if: steps.xray-go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-xray-${{ steps.xray-version.outputs.fork }}

      - name: Save Xray binary cache
        if: steps.xray-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ runner.os }}-xray-${{ steps.xray-version.outputs.fork }}

      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/check_proxies.py scripts/polish_light.py
          git diff --check

      - name: Check runner network
        run: |
          curl -fsS --max-time 10 http://cp.cloudflare.com:80/ -o /dev/null
          curl -fsS --max-time 10 https://api.ipify.org?format=json -o /dev/null

      - name: Prepare temporary workspace
        run: mkdir -p /tmp/proxy-harvester

      - name: Build collector
        run: cargo build --release

      - name: Save Rust registry cache
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Rust build cache
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}

      - name: Collect and transport-test configs
        run: ./target/release/proxy-harvester

      - name: Build Light subscription
        run: |
          set +e
          python3 scripts/polish_light.py \
            --candidates subscriptions/.light-candidates.txt \
            --output /tmp/proxy-harvester/light.next.txt \
            --checker scripts/check_proxies.py \
            --workers 24 \
            --batch-size 100 \
            --timeout 1 \
            --final-recheck-limit 500 \
            --final-workers 12 \
            --final-batch-size 1 \
            --primary-target http://cp.cloudflare.com:80/ \
            --selection-limit 200 \
            --max-per-endpoint 1
          status=$?
          set -e

          if [ -s /tmp/proxy-harvester/light.next.txt ]; then
            cp /tmp/proxy-harvester/light.next.txt subscriptions/light.txt
            echo "Published refreshed Light subscription."
          elif [ "$status" -ne 0 ]; then
            echo "Light validation did not produce a new verified pool; preserving the previous Light subscription."
          else
            echo "Light validation produced no configs; preserving the previous Light subscription."
          fi

      - name: Generate Base64 subscriptions
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          for name in ("all", "light"):
              path = Path("subscriptions") / f"{name}.txt"
              if not path.exists():
                  continue
              payload = path.read_bytes().rstrip(b"\r\n")
              encoded = base64.b64encode(payload).decode("ascii")
              (Path("subscriptions") / f"{name}-base64.txt").write_text(
                  encoded + "\n",
                  encoding="ascii",
              )
          PY

      - name: Clean obsolete caches
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          current_registry_key="${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}"
          current_build_key="${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}"
          current_go_key="${{ runner.os }}-go-xray-${{ steps.xray-version.outputs.fork }}"
          current_xray_key="${{ runner.os }}-xray-${{ steps.xray-version.outputs.fork }}"

          cleanup_prefix() {
            local prefix="$1"
            local current_key="$2"

            gh cache list \
              --repo "$GH_REPO" \
              --key "$prefix" \
              --ref refs/heads/main \
              --limit 100 \
              --json id,key \
              --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r cache_id cache_key; do
              [ -z "$cache_id" ] && continue
              if [ "$cache_key" = "$current_key" ]; then
                continue
              fi
              echo "Deleting obsolete cache $cache_id ($cache_key)"
              gh api --method DELETE "/repos/$GH_REPO/actions/caches/$cache_id"
            done
          }

          delete_prefix() {
            local prefix="$1"

            gh cache list \
              --repo "$GH_REPO" \
              --key "$prefix" \
              --ref refs/heads/main \
              --limit 100 \
              --json id,key \
              --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r cache_id cache_key; do
              [ -z "$cache_id" ] && continue
              echo "Deleting obsolete cache $cache_id ($cache_key)"
              gh api --method DELETE "/repos/$GH_REPO/actions/caches/$cache_id"
            done
          }

          cleanup_prefix "${{ runner.os }}-cargo-registry-" "$current_registry_key"
          cleanup_prefix "${{ runner.os }}-cargo-build-" "$current_build_key"
          cleanup_prefix "${{ runner.os }}-go-xray-" "$current_go_key"
          cleanup_prefix "${{ runner.os }}-xray-" "$current_xray_key"

          delete_prefix "${{ runner.os }}-go-singbox-"
          delete_prefix "${{ runner.os }}-pip-singbox2proxy-"
          delete_prefix "${{ runner.os }}-sing-box-"

      - name: Clean generated temporary files
        if: always()
        run: |
          rm -rf /tmp/proxy-harvester /tmp/xray-build
          rm -f subscriptions/.*.txt

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions Cargo.lock

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update subscriptions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
