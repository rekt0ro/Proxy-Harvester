name: Update Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load sources
        env:
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
        run: |
          test -n "$PROXY_SOURCES"
          printf '%s\n' "$PROXY_SOURCES" > sources.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust registry cache
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Resolve latest tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail

          sing_box_version="$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"].removeprefix("v"))')"
          singbox2proxy_version="$(curl -fsSL https://pypi.org/pypi/singbox2proxy/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"

          echo "sing_box=$sing_box_version" >> "$GITHUB_OUTPUT"
          echo "singbox2proxy=$singbox2proxy_version" >> "$GITHUB_OUTPUT"

          echo "Latest sing-box: $sing_box_version"
          echo "Latest singbox2proxy: $singbox2proxy_version"

      - name: Update Rust dependencies
        run: |
          set -euo pipefail
          test -f Cargo.toml
          cargo update

          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is tracked and was refreshed to the latest compatible versions."
          else
            echo "Cargo.lock created with the latest compatible versions."
          fi

      - name: Restore Rust build cache
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Cache Go build and module data
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-singbox-${{ steps.tool-versions.outputs.sing_box }}
          restore-keys: |
            ${{ runner.os }}-go-singbox-

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-singbox2proxy-${{ steps.tool-versions.outputs.singbox2proxy }}
          restore-keys: |
            ${{ runner.os }}-pip-singbox2proxy-

      - name: Cache sing-box binary
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/sing-box
          key: ${{ runner.os }}-sing-box-${{ steps.tool-versions.outputs.sing_box }}-with_quic-with_wireguard-with_utls-with_clash_api-with_gvisor

      - name: Install proxy tester
        env:
          SING_BOX_VERSION: ${{ steps.tool-versions.outputs.sing_box }}
          SINGBOX2PROXY_VERSION: ${{ steps.tool-versions.outputs.singbox2proxy }}
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check --upgrade "singbox2proxy[socks]==$SINGBOX2PROXY_VERSION"
          mkdir -p "$HOME/.local/bin"

          if [ ! -x "$HOME/.local/bin/sing-box" ]; then
            git clone --depth 1 --branch "v$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box
            TAGS="with_quic with_wireguard with_utls with_clash_api with_gvisor" make
            install -m 0755 sing-box "$HOME/.local/bin/sing-box"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sing-box" version
          "$HOME/.local/bin/sing-box" version | grep -q "$SING_BOX_VERSION" || {
            echo "Unexpected sing-box version"
            exit 1
          }
          "$HOME/.local/bin/sing-box" version | grep -q 'with_utls' || {
            echo "sing-box was built without with_utls"
            exit 1
          }

      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/check_proxies.py scripts/polish_light.py
          git diff --check

      - name: Check runner network
        run: |
          curl -fsS --max-time 10 http://cp.cloudflare.com:80/ -o /dev/null
          curl -fsS --max-time 10 https://api.ipify.org?format=json -o /dev/null

      - name: Prepare temporary workspace
        run: mkdir -p /tmp/proxy-harvester

      - name: Build collector
        run: cargo build --release

      - name: Save Rust registry cache
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Rust build cache
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}

      - name: Collect and transport-test configs
        run: ./target/release/proxy-harvester

      - name: Build Light subscription
        run: |
          set +e
          python3 scripts/polish_light.py \
            --candidates subscriptions/.light-candidates.txt \
            --output /tmp/proxy-harvester/light.next.txt \
            --checker scripts/check_proxies.py \
            --workers 24 \
            --batch-size 100 \
            --timeout 1 \
            --final-recheck-limit 500 \
            --final-workers 12 \
            --final-batch-size 1 \
            --primary-target http://cp.cloudflare.com:80/ \
            --secondary-target https://www.google.com/generate_204 \
            --selection-limit 200 \
            --max-per-endpoint 1
          status=$?
          set -e

          if [ -s /tmp/proxy-harvester/light.next.txt ]; then
            cp /tmp/proxy-harvester/light.next.txt subscriptions/light.txt
            echo "Published refreshed Light subscription."
          elif [ "$status" -ne 0 ]; then
            echo "Light validation did not produce a new verified pool; preserving the previous Light subscription."
          else
            echo "Light validation produced no configs; preserving the previous Light subscription."
          fi

      - name: Generate Base64 subscriptions
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          for name in ("all", "light"):
              path = Path("subscriptions") / f"{name}.txt"
              if not path.exists():
                  continue
              payload = path.read_bytes().rstrip(b"\r\n")
              encoded = base64.b64encode(payload).decode("ascii")
              (Path("subscriptions") / f"{name}-base64.txt").write_text(
                  encoded + "\n",
                  encoding="ascii",
              )
          PY

      - name: Clean generated temporary files
        if: always()
        run: |
          rm -rf /tmp/proxy-harvester
          rm -f subscriptions/.*.txt

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions Cargo.lock

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update subscriptions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
