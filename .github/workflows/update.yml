name: "🔄 ProxyRift Update"
run-name: "🔄 ProxyRift Update #${{ github.run_number }}"

on:
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: read

env:
  XRAY_REPOSITORY: "XTLS/Xray-core"
  SINGBOX_REPOSITORY: "SagerNet/sing-box"

jobs:
  collect:
    name: "🔎 Collect & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      rust_toolchain_key: ${{ steps.keys.outputs.rust-toolchain }}
      registry_key: ${{ steps.keys.outputs.registry }}
      build_key: ${{ steps.keys.outputs.build }}
      xray_key: ${{ steps.keys.outputs.xray }}
      singbox_key: ${{ steps.keys.outputs.singbox }}

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7

      - name: "🦀 Resolve stable Rust toolchain"
        id: rust-toolchain
        run: |
          set -euo pipefail

          stable_channel="$(curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 45 \
            --retry-connrefused \
            https://static.rust-lang.org/dist/channel-rust-stable.toml)"

          rust_version="$(awk -F'"' '/^\[pkg\.rustc\]$/ { in_rustc=1; next } /^\[/ { in_rustc=0 } in_rustc && /^[[:space:]]*version[[:space:]]*=/ { split($2, parts, " "); print parts[1]; exit }' <<< "$stable_channel")"
          test -n "$rust_version"
          [[ "$rust_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"

      - name: "🦀 Restore Rust toolchain cache"
        id: rust-toolchain-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ steps.rust-toolchain.outputs.version }}

      - name: "🦀 Set up Rust"
        run: |
          set -euo pipefail

          toolchain="${{ steps.rust-toolchain.outputs.version }}"
          if ! rustup toolchain list | awk '{print $1}' | grep -E "^$toolchain(-|$)" >/dev/null; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          fi
          rustup default "$toolchain"

      - name: "📌 Record Rust version"
        id: rust-version
        run: |
          actual_version="$(rustc --version | awk '{print $2}')"
          test "$actual_version" = "${{ steps.rust-toolchain.outputs.version }}"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"

      - name: "🔒 Verify dependency lock"
        run: test -s Cargo.lock

      - name: "🌐 Resolve pinned validation cores"
        id: validation-cores
        env:
          XRAY_VERSION_PIN: "26.3.27"
          XRAY_SHA256_PIN: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
          XRAY_ASSET_PIN: "Xray-linux-64.zip"
          SINGBOX_VERSION_PIN: "1.14.2"
          SINGBOX_SHA256_PIN: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"
          SINGBOX_ASSET_PIN: "sing-box-1.14.2-linux-amd64.tar.gz"
        run: |
          set -euo pipefail

          [[ "$XRAY_VERSION_PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$XRAY_SHA256_PIN" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SINGBOX_VERSION_PIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SINGBOX_SHA256_PIN" =~ ^[0-9a-f]{64}$ ]]
          test "$XRAY_ASSET_PIN" = "Xray-linux-64.zip"
          test "$SINGBOX_ASSET_PIN" = "sing-box-1.14.2-linux-amd64.tar.gz"

          {
            echo "xray_version=$XRAY_VERSION_PIN"
            echo "xray_sha256=$XRAY_SHA256_PIN"
            echo "xray_asset=$XRAY_ASSET_PIN"
            echo "singbox_version=$SINGBOX_VERSION_PIN"
            echo "singbox_sha256=$SINGBOX_SHA256_PIN"
            echo "singbox_asset=$SINGBOX_ASSET_PIN"
          } >> "$GITHUB_OUTPUT"

          echo "[INFO] 🧩 [CORES] PINNED RELEASES | Xray $XRAY_VERSION_PIN | sing-box $SINGBOX_VERSION_PIN"
      - name: "⚡ Compute cache keys"
        id: keys
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
          RUST_VERSION: ${{ steps.rust-version.outputs.version }}
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          XRAY_SHA256: ${{ steps.validation-cores.outputs.xray_sha256 }}
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
          SINGBOX_SHA256: ${{ steps.validation-cores.outputs.singbox_sha256 }}
        run: |
          {
            echo "rust-toolchain=${RUNNER_OS_NAME}-${{ runner.arch }}-rust-toolchain-${RUST_VERSION}"
            echo "registry=${RUNNER_OS_NAME}-cargo-registry-${LOCK_HASH}"
            echo "build=${RUNNER_OS_NAME}-cargo-build-rust-${RUST_VERSION}-${LOCK_HASH}"
            echo "xray=${RUNNER_OS_NAME}-xray-${XRAY_VERSION}-${XRAY_SHA256}-verified"
            echo "singbox=${RUNNER_OS_NAME}-sing-box-${SINGBOX_VERSION}-${SINGBOX_SHA256}-verified"
          } >> "$GITHUB_OUTPUT"
      - name: "💾 Restore Rust registry cache"
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.keys.outputs.registry }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: "💾 Restore Rust build cache"
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ steps.keys.outputs.build }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-

      - name: "📦 Restore Xray binary cache"
        id: xray-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ steps.keys.outputs.xray }}

      - name: "🛡️ Install Xray (latest stable, checksum-verified)"
        env:
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          XRAY_SHA256: ${{ steps.validation-cores.outputs.xray_sha256 }}
          XRAY_ASSET: ${{ steps.validation-cores.outputs.xray_asset }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/bin" /tmp/xray-download

          if [ ! -x "$HOME/.local/bin/xray" ]; then
            if [[ ! "$XRAY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "XRAY_SHA256 is not a valid SHA-256 from the release metadata." >&2
              exit 1
            fi

            asset_url="https://github.com/${XRAY_REPOSITORY}/releases/download/v${XRAY_VERSION}/${XRAY_ASSET}"
            curl -fsSL "$asset_url" -o /tmp/xray-download/xray.zip
            echo "${XRAY_SHA256}  /tmp/xray-download/xray.zip" | sha256sum -c -
            unzip -q /tmp/xray-download/xray.zip -d /tmp/xray-download/extracted
            install -m 0755 /tmp/xray-download/extracted/xray "$HOME/.local/bin/xray"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xray" version

      - name: "💾 Save Xray binary cache"
        if: steps.xray-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ steps.keys.outputs.xray }}

      - name: "📦 Restore sing-box binary cache"
        id: singbox-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin/sing-box
          key: ${{ steps.keys.outputs.singbox }}

      - name: "🛡️ Install sing-box (latest stable, checksum-verified)"
        env:
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
          SINGBOX_SHA256: ${{ steps.validation-cores.outputs.singbox_sha256 }}
          SINGBOX_ASSET: ${{ steps.validation-cores.outputs.singbox_asset }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/bin" /tmp/singbox-download

          if [ ! -x "$HOME/.local/bin/sing-box" ]; then
            if [[ ! "$SINGBOX_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "SINGBOX_SHA256 is not a valid SHA-256 from the release metadata." >&2
              exit 1
            fi

            asset_url="https://github.com/${SINGBOX_REPOSITORY}/releases/download/v${SINGBOX_VERSION}/${SINGBOX_ASSET}"
            curl -fsSL "$asset_url" -o /tmp/singbox-download/sing-box.tar.gz
            echo "${SINGBOX_SHA256}  /tmp/singbox-download/sing-box.tar.gz" | sha256sum -c -
            tar -xzf /tmp/singbox-download/sing-box.tar.gz -C /tmp/singbox-download
            install -m 0755 "/tmp/singbox-download/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" "$HOME/.local/bin/sing-box"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          singbox_version="$("$HOME/.local/bin/sing-box" version | head -n 1)"
          echo "[INFO] 🧩 [SING-BOX] VERSION | ${singbox_version}"
          grep -F "$SINGBOX_VERSION" <<< "$singbox_version" >/dev/null

      - name: "💾 Save sing-box binary cache"
        if: steps.singbox-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/bin/sing-box
          key: ${{ steps.keys.outputs.singbox }}

      - name: "✨ Validate Rust formatting"
        run: cargo fmt --all

      - name: "🌍 Check runner network"
        run: |
          curl -fsS --max-time 10 "https://speed.cloudflare.com/__down?bytes=1" -o /dev/null
          curl -fsS --max-time 10 "https://api.ipify.org?format=json" -o /dev/null
          echo "[INFO] 🌍 [NETWORK] RUNNER CONNECTIVITY OK"

      - name: "🔨 Build Rust binaries"
        run: |
          cargo build --release --locked --bins --quiet
          test -x ./target/release/ProxyRift
          test -x ./target/release/check_proxies
          test -x ./target/release/polish_light
          test -x ./target/release/encode_subscriptions
          test -x ./target/release/discover_sources

      - name: "💾 Save Rust toolchain cache"
        if: steps.rust-toolchain-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.rustup/toolchains
          key: ${{ steps.keys.outputs.rust-toolchain }}

      - name: "💾 Save Rust registry cache"
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.keys.outputs.registry }}

      - name: "💾 Save Rust build cache"
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target
          key: ${{ steps.keys.outputs.build }}

      - name: "🔭 Discover GitHub subscription sources"
        id: discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./target/release/discover_sources

      - name: "🔎 Collect & transport-test configs"
        id: collect_transport
        run: |
          ./target/release/ProxyRift

      - name: "💡 Build Light subscription"
        id: build_light
        env:
          LIGHT_MAX_CANDIDATES: "10000"
          LIGHT_SELECTION_LIMIT: "200"
          LIGHT_MIN_PUBLISH: "50"
        run: |
          mkdir -p /tmp/proxyrift
          set +e
          ./target/release/polish_light \
            --candidates subscriptions/.light-candidates.txt \
            --output /tmp/proxyrift/light.next.txt \
            --workers 48 \
            --batch-size 1000 \
            --timeout 3 \
            --selected-recheck-limit 350 \
            --max-candidates "$LIGHT_MAX_CANDIDATES" \
            --selected-workers 48 \
            --selected-batch-size 350 \
            --primary-target https://www.google.com/generate_204 \
            --singbox "$HOME/.local/bin/sing-box" \
            --selection-limit "$LIGHT_SELECTION_LIMIT" \
            --max-per-endpoint 1 \
            --max-per-family 3 \
            --stats /tmp/proxyrift/light-stats.json
          status=$?
          set -e
          echo "[INFO] ✅ [LIGHT] VALIDATION COMPLETE | $light_elapsed"

          if [ "$status" -ne 0 ]; then
            echo "[WARN] ⚠️ [LIGHT] VALIDATION FAILED | PRESERVING PREVIOUS SUBSCRIPTION" >&2
            exit "$status"
          fi

          if [ -s /tmp/proxyrift/light.next.txt ]; then
            light_count="$(awk 'NF { count++ } END { print count + 0 }' /tmp/proxyrift/light.next.txt)"
            echo "[INFO] 🎯 [LIGHT] OUTPUT | ${light_count} CANDIDATES | TARGET/MAX: ${LIGHT_SELECTION_LIMIT} | MIN PUBLISH: ${LIGHT_MIN_PUBLISH}"
            if [ "$light_count" -ge "$LIGHT_MIN_PUBLISH" ]; then
              cp /tmp/proxyrift/light.next.txt subscriptions/.light.txt.next
              mv -f subscriptions/.light.txt.next subscriptions/light.txt
              echo "[INFO] ✅ [LIGHT] PUBLISHED REFRESHED SUBSCRIPTION"
            else
              echo "[WARN] ⚠️ [LIGHT] POOL TOO SMALL | ${light_count}/${LIGHT_MIN_PUBLISH} MINIMUM | PRESERVING PREVIOUS SUBSCRIPTION"
            fi
          else
            echo "[WARN] ⚠️ [LIGHT] NO CONFIGS | PRESERVING PREVIOUS SUBSCRIPTION"
          fi

      - name: "🏷️ Add subscription update metadata"
        id: subscription_metadata
        run: |
          for f in subscriptions/all.txt subscriptions/light.txt; do
            test -s "$f"
            tmp="${f}.tmp"
            { 
              printf '%s\n' '#profile-update-interval: 1'
              cat "$f"
            } > "$tmp"
            mv -f "$tmp" "$f"
          done

      - name: "🧬 Generate Base64 subscriptions"
        id: generate_base64
        run: |
          ./target/release/encode_subscriptions

      - name: "📦 Prepare published outputs"
        id: prepare_outputs
        run: |
          for f in subscriptions/all.txt subscriptions/light.txt subscriptions/all-base64.txt subscriptions/light-base64.txt; do
            test -s "$f"
          done

      - name: "🚀 Publish generated changes"
        id: publish
        run: |
          set -euo pipefail

          files="all.txt light.txt all-base64.txt light-base64.txt"
          publish_snapshot="$(mktemp -d /tmp/proxyrift-publish.XXXXXX)"
          trap 'rm -rf "$publish_snapshot"' EXIT

          mkdir -p "$publish_snapshot/subscriptions"
          for f in $files; do
            test -s "subscriptions/${f}"
            cp -- "subscriptions/${f}" "$publish_snapshot/subscriptions/${f}"
          done

          if [ -s "subscriptions/light-history.json" ]; then
            cp -- subscriptions/light-history.json "$publish_snapshot/subscriptions/light-history.json"
          fi

          if [ -s "subscriptions/light-training.jsonl" ]; then
            cp -- subscriptions/light-training.jsonl "$publish_snapshot/subscriptions/light-training.jsonl"
          fi
          if [ -s "subscriptions/light-ai.json" ]; then
            cp -- subscriptions/light-ai.json "$publish_snapshot/subscriptions/light-ai.json"
          fi
          if [ -s "subscriptions/source-registry.json" ]; then
            cp -- subscriptions/source-registry.json "$publish_snapshot/subscriptions/source-registry.json"
          fi

          git config user.name "rekt0ro"
          git config user.email "104654981+rekt0ro@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "[INFO] 📤 [PUBLISH] ATTEMPT ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main

            # Reapply the freshly generated subscription artifacts after syncing with main.
            for f in $files; do
              cp -- "$publish_snapshot/subscriptions/${f}" "subscriptions/${f}"
            done

            if [ -f "$publish_snapshot/subscriptions/light-history.json" ]; then
              cp -- "$publish_snapshot/subscriptions/light-history.json" subscriptions/light-history.json
            fi

            if [ -f "$publish_snapshot/subscriptions/light-training.jsonl" ]; then
              cp -- "$publish_snapshot/subscriptions/light-training.jsonl" subscriptions/light-training.jsonl
            fi
            if [ -f "$publish_snapshot/subscriptions/light-ai.json" ]; then
              cp -- "$publish_snapshot/subscriptions/light-ai.json" subscriptions/light-ai.json
            fi
            if [ -f "$publish_snapshot/subscriptions/source-registry.json" ]; then
              cp -- "$publish_snapshot/subscriptions/source-registry.json" subscriptions/source-registry.json
            fi


            git add -- \
              subscriptions/all.txt \
              subscriptions/light.txt \
              subscriptions/all-base64.txt \
              subscriptions/light-base64.txt

            if [ -f "subscriptions/light-history.json" ]; then
              git add -- subscriptions/light-history.json
            fi

            if [ -f "subscriptions/light-training.jsonl" ]; then
              git add -- subscriptions/light-training.jsonl
            fi
            if [ -f "subscriptions/light-ai.json" ]; then
              git add -- subscriptions/light-ai.json
            fi
            if [ -f "subscriptions/source-registry.json" ]; then
              git add -- subscriptions/source-registry.json
            fi


            if git diff --cached --quiet; then
              echo "[INFO] 📤 [PUBLISH] NO CHANGES"
              exit 0
            fi

            git commit -m "Update subscriptions"

            push_output=""
            push_status=0
            push_output="$(git push origin HEAD:main 2>&1)" || push_status=$?
            printf '%s\n' "$push_output"

            if [ "$push_status" -eq 0 ]; then
              echo "[INFO] ✅ [PUBLISH] SUBSCRIPTION UPDATE PUBLISHED"
              exit 0
            fi

            if grep -Eiq 'non-fast-forward|fetch first|tip of your current branch is behind|updates were rejected because the tip' <<< "$push_output"; then
              echo "[WARN] ⚠️ [PUBLISH] MAIN MOVED | RETRYING"
              git reset --hard
              continue
            fi

            echo "[ERROR] ❌ [PUBLISH] PUSH FAILED FOR A NON-RACE REASON" >&2
            exit "$push_status"
          done

          echo "[ERROR] ❌ [PUBLISH] FAILED AFTER 5 ATTEMPTS" >&2
          exit 1

      - name: "📊 Write run summary"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect_transport.outcome }}
          LIGHT_OUTCOME: ${{ steps.build_light.outcome }}
          METADATA_OUTCOME: ${{ steps.subscription_metadata.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate_base64.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare_outputs.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
        run: |
          set +e

          stage_status() {
            local outcome="$1"
            case "$outcome" in
              success) printf "✅ Complete" ;;
              failure) printf "❌ Failed" ;;
              cancelled) printf "⏹️ Cancelled" ;;
              skipped) printf "⏭️ Skipped" ;;
              *) printf "⚪ Unknown" ;;
            esac
          }

          collection_status="$(stage_status "$DISCOVERY_OUTCOME")"
          if [ "$collection_status" = "✅ Complete" ] && [ "$COLLECT_OUTCOME" != "success" ]; then
            collection_status="$(stage_status "$COLLECT_OUTCOME")"
          fi
          if [ "$collection_status" = "✅ Complete" ] && [ "$LIGHT_OUTCOME" != "success" ]; then
            collection_status="$(stage_status "$LIGHT_OUTCOME")"
          fi

          generation_status="$(stage_status "$METADATA_OUTCOME")"
          if [ "$generation_status" = "✅ Complete" ] && [ "$GENERATION_OUTCOME" != "success" ]; then
            generation_status="$(stage_status "$GENERATION_OUTCOME")"
          fi
          if [ "$generation_status" = "✅ Complete" ] && [ "$PREPARE_OUTCOME" != "success" ]; then
            generation_status="$(stage_status "$PREPARE_OUTCOME")"
          fi

          publish_status="$(stage_status "$PUBLISH_OUTCOME")"
          overall_status="$(stage_status "$JOB_STATUS")"

          count_configs() {
            if [ -s "$1" ]; then
              awk 'NF && $0 !~ /^#profile-update-interval:/ { count++ } END { print count + 0 }' "$1"
            else
              printf '0'
            fi
          }

          all_count="$(count_configs subscriptions/all.txt)"
          light_count="$(count_configs subscriptions/light.txt)"

          input_candidates="unknown"
          security_rejected="unknown"
          strict_verified="unknown"
          transfer_tested="unknown"
          transfer_passed="unknown"
          stream_tested="unknown"
          stream_passed="unknown"
          published="unknown"
          ml_rows="0"
          ml_strict_passes="0"
          ml_transfer_tests="0"
          ml_transfer_passes="0"
          ml_strict_rate="0.0"
          ml_feature_count="0"
          if [ -s "subscriptions/light-training.jsonl" ]; then
            ml_stats="$(jq -s '
              {
                rows: length,
                strict_passes: (map(select(.label.strict_pass == true)) | length),
                transfer_tests: (map(select(.label.transfer_tested == true)) | length),
                transfer_passes: (map(select(.label.transfer_tested == true and .label.transfer_pass == true)) | length)
              }' subscriptions/light-training.jsonl 2>/dev/null || true)"
            if [ -n "$ml_stats" ]; then
              ml_rows="$(jq -r '.rows // 0' <<< "$ml_stats")"
              ml_feature_count="$(head -n 1 subscriptions/light-training.jsonl | jq -r '.features | length' 2>/dev/null || printf '0')"
              ml_strict_passes="$(jq -r '.strict_passes // 0' <<< "$ml_stats")"
              ml_transfer_tests="$(jq -r '.transfer_tests // 0' <<< "$ml_stats")"
              ml_transfer_passes="$(jq -r '.transfer_passes // 0' <<< "$ml_stats")"
              if [ "$ml_rows" -gt 0 ]; then
                ml_strict_rate="$(awk -v passes="$ml_strict_passes" -v rows="$ml_rows" 'BEGIN { printf "%.1f", (passes / rows) * 100 }')"
              fi
            fi
          fi
          if [ -s /tmp/proxyrift/light-stats.json ]; then
            input_candidates="$(jq -r '.input_candidates // "unknown"' /tmp/proxyrift/light-stats.json)"
            security_rejected="$(jq -r '.security_rejected // "unknown"' /tmp/proxyrift/light-stats.json)"
            strict_verified="$(jq -r '.strict_verified // "unknown"' /tmp/proxyrift/light-stats.json)"
            transfer_tested="$(jq -r '.transfer_tested // "unknown"' /tmp/proxyrift/light-stats.json)"
            transfer_passed="$(jq -r '.transfer_passed // "unknown"' /tmp/proxyrift/light-stats.json)"
            stream_tested="$(jq -r '.stream_continuity_tested // "unknown"' /tmp/proxyrift/light-stats.json)"
            stream_passed="$(jq -r '.stream_continuity_passed // "unknown"' /tmp/proxyrift/light-stats.json)"
            published="$(jq -r '.published // "unknown"' /tmp/proxyrift/light-stats.json)"
          fi

          current_jobs=""
          if current_jobs="$(gh api --method GET "/repos/$GH_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" 2>/dev/null)"; then
            :
          fi

          step_elapsed() {
            local step_name="$1"
            if [ -z "$current_jobs" ]; then
              printf "%s" "unknown"
              return
            fi
            local elapsed
            elapsed="$(jq -r --arg step "$step_name" '.jobs[] | .steps[] | select(.name == $step and .started_at != null and .completed_at != null) | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | tostring' <<< "$current_jobs" | head -n 1)"
            [ -n "$elapsed" ] || elapsed="unknown"
            printf "%s" "$elapsed"
          }

          collect_elapsed="$(step_elapsed "🔎 Collect & transport-test configs")"
          light_elapsed="$(step_elapsed "💡 Build Light subscription")"

          current_job_started=""
          current_publish_completed=""
          if [ -n "$current_jobs" ]; then
            current_job_started="$(jq -r '.jobs[] | select(.name == "🔎 Collect & Validate") | .started_at // empty' <<< "$current_jobs" | head -n 1)"
            current_publish_completed="$(jq -r '.jobs[] | select(.name == "🔎 Collect & Validate") | .steps[] | select(.name == "🚀 Publish generated changes") | .completed_at // empty' <<< "$current_jobs" | head -n 1)"
          fi

          pipeline_elapsed="unknown"
          if [[ "$current_job_started" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            job_started_epoch="$(date -d "$current_job_started" +%s 2>/dev/null || true)"
            if [[ "$job_started_epoch" =~ ^[0-9]+$ ]]; then
              pipeline_end_epoch="$(date +%s)"
              if [[ "$current_publish_completed" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
                pipeline_end_epoch="$(date -d "$current_publish_completed" +%s 2>/dev/null || printf "%s" "$pipeline_end_epoch")"
              fi
              pipeline_elapsed="$(( pipeline_end_epoch - job_started_epoch ))"
            fi
          fi

          format_minutes() {
            local seconds="$1"
            if [[ "$seconds" =~ ^[0-9]+$ ]]; then
              awk -v seconds="$seconds" 'BEGIN { printf "%.1f min", seconds / 60 }'
            else
              printf '%s' "unknown"
            fi
          }

          format_delta() {
            local current="$1"
            local previous="$2"
            if [[ "$current" =~ ^[0-9]+$ && "$previous" =~ ^[0-9]+$ ]]; then
              awk -v current="$current" -v previous="$previous" '
                BEGIN {
                  delta = current - previous
                  pct = previous > 0 ? (delta / previous) * 100 : 0
                  printf "%+.1f min (%+.1f%%)", delta / 60, pct
                }'
            else
              printf '%s' "unknown"
            fi
          }

          previous_run_id=""
          previous_run_number=""
          previous_total_elapsed="unknown"
          previous_collect_elapsed="unknown"
          previous_light_elapsed="unknown"

          if previous_runs="$(
            gh api --method GET \
              "/repos/$GH_REPOSITORY/actions/workflows/update.yml/runs?per_page=30" \
              2>/dev/null
          )"; then
            previous_run_id="$(
              jq -r --argjson current_run "${{ github.run_number }}" '
                [.workflow_runs[]
                 | select(.status == "completed" and .run_number < $current_run)]
                | sort_by(.run_number)
                | last
                | .id // empty' <<< "$previous_runs"
            )"

            previous_run_number="$(
              jq -r --argjson current_run "${{ github.run_number }}" '
                [.workflow_runs[]
                 | select(.status == "completed" and .run_number < $current_run)]
                | sort_by(.run_number)
                | last
                | .run_number // empty' <<< "$previous_runs"
            )"
          fi

          if [ -n "$previous_run_id" ]; then
            if previous_jobs="$(
              gh api --method GET \
                "/repos/$GH_REPOSITORY/actions/runs/$previous_run_id/jobs?per_page=100" \
                2>/dev/null
            )"; then
              previous_collect_elapsed="$(
                jq -r \
                  --arg step "🔎 Collect & transport-test configs" \
                  '.jobs[]
                   | .steps[]
                   | select(.name == $step and .started_at != null and .completed_at != null)
                   | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))
                   | tostring' <<< "$previous_jobs" | head -n 1
              )"

              previous_light_elapsed="$(
                jq -r \
                  --arg step "💡 Build Light subscription" \
                  '.jobs[]
                   | .steps[]
                   | select(.name == $step and .started_at != null and .completed_at != null)
                   | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))
                   | tostring' <<< "$previous_jobs" | head -n 1
              )"

              previous_summary_epoch="$(
                jq -r                   '.jobs[]
                   | select(.name == "🔎 Collect & Validate")
                   | .steps[]
                   | select(.name == "🚀 Publish generated changes" and .completed_at != null)
                   | (.completed_at | fromdateiso8601)
                   | tostring' <<< "$previous_jobs" | head -n 1
              )"

              previous_job_started="$(
                jq -r \
                  '.jobs[]
                   | select(.name == "🔎 Collect & Validate")
                   | .started_at
                   | select(. != null)
                   | fromdateiso8601
                   | tostring' <<< "$previous_jobs" | head -n 1
              )"

              if [[ "$previous_summary_epoch" =~ ^[0-9]+$ && "$previous_job_started" =~ ^[0-9]+$ ]]; then
                previous_total_elapsed="$(( previous_summary_epoch - previous_job_started ))"
              fi
            fi
          fi

          current_total_display="$(format_minutes "$pipeline_elapsed")"
          current_collect_display="$(format_minutes "$collect_elapsed")"
          current_light_display="$(format_minutes "$light_elapsed")"
          previous_total_display="$(format_minutes "$previous_total_elapsed")"
          previous_collect_display="$(format_minutes "$previous_collect_elapsed")"
          previous_light_display="$(format_minutes "$previous_light_elapsed")"
          total_delta_display="$(format_delta "$pipeline_elapsed" "$previous_total_elapsed")"
          collect_delta_display="$(format_delta "$collect_elapsed" "$previous_collect_elapsed")"
          light_delta_display="$(format_delta "$light_elapsed" "$previous_light_elapsed")"

          {
            echo "## 🔄 ProxyRift Update"
            echo
            echo "| Stage | Status |"
            echo "|---|---|"
            echo "| Workflow | $overall_status |"
            echo "| Collection & validation | $collection_status |"
            echo "| Subscription generation | $generation_status |"
            echo "| Publish | $publish_status |"
            echo
            echo "### ⏱️ Benchmark"
            echo
            echo "| Stage | This run | Previous run | Δ |"
            echo "|---|---:|---:|---:|"
            if [ -n "$previous_run_number" ]; then
              echo "| Total pipeline | $current_total_display | $previous_total_display | $total_delta_display |"
              echo "| Collection & transport | $current_collect_display | $previous_collect_display | $collect_delta_display |"
              echo "| Light validation | $current_light_display | $previous_light_display | $light_delta_display |"
              echo
              echo "_Comparison is against the immediately preceding completed update run (#$previous_run_number)._"
            else
              echo "| Total pipeline | $current_total_display | — | — |"
              echo "| Collection & transport | $current_collect_display | — | — |"
              echo "| Light validation | $current_light_display | — | — |"
              echo
              echo "_No preceding completed update run was found._"
            fi
            echo
            echo "### 🔬 Light validation"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Input candidates | $input_candidates |"
            echo "| TLS bypass rejected | $security_rejected |"
            echo "| Strictly verified | $strict_verified |"
            echo "| 10 MiB tested | $transfer_tested |"
            echo "| 10 MiB passed | $transfer_passed |"
            echo "| Stream continuity tested | $stream_tested |"
            echo "| Stream continuity passed | $stream_passed |"
            echo "| Published by validator | $published |"
            echo
            echo "### 🧠 Light ML dataset"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Dataset rows | $ml_rows |"
            echo "| Features per row | $ml_feature_count |"
            echo "| Strict pass rate | $ml_strict_rate% |"
            echo "| Transfer labels | $ml_transfer_passes/$ml_transfer_tests passed |"
            echo
            echo "### 📦 Published outputs"
            echo
            echo "| Output | Config entries |"
            echo "|---|---:|"
            echo "| All | $all_count |"
            echo "| Light | $light_count |"
            echo "| All Base64 | encoded from All |"
            echo "| Light Base64 | encoded from Light |"
            echo
            echo "### 🛡️ Validation cores"
            echo
            echo "| Core | Version |"
            echo "|---|---|"
            echo "| Xray | $XRAY_VERSION |"
            echo "| sing-box | $SINGBOX_VERSION |"
            echo
            echo "_Generated by the ProxyRift update workflow._"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: "🧹 Cleanup Caches"
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
      - name: "🧹 Clean obsolete caches"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          RUST_TOOLCHAIN_KEY: ${{ needs.collect.outputs.rust_toolchain_key }}
          REGISTRY_KEY: ${{ needs.collect.outputs.registry_key }}
          BUILD_KEY: ${{ needs.collect.outputs.build_key }}
          XRAY_KEY: ${{ needs.collect.outputs.xray_key }}
          SINGBOX_KEY: ${{ needs.collect.outputs.singbox_key }}
        shell: bash
        run: |
          set -euo pipefail

          for k in "$RUST_TOOLCHAIN_KEY" "$REGISTRY_KEY" "$BUILD_KEY" "$XRAY_KEY" "$SINGBOX_KEY"; do
            if [ -z "$k" ]; then
              echo "Refusing cache cleanup because a current cache key is empty." >&2
              exit 1
            fi
          done

          cleanup_prefix() {
            local prefix="$1"
            local current_key="$2"

            gh cache list \
              --repo "$GH_REPO" \
              --key "$prefix" \
              --ref refs/heads/main \
              --limit 100 \
              --json id,key \
              --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r cache_id cache_key; do
              [ -z "$cache_id" ] && continue
              if [ "$cache_key" = "$current_key" ]; then
                continue
              fi
              echo "Deleting obsolete cache $cache_id ($cache_key)"
              gh api --method DELETE "/repos/$GH_REPO/actions/caches/$cache_id"
            done
          }

          cleanup_prefix "${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}-rust-toolchain-" "$RUST_TOOLCHAIN_KEY"
          cleanup_prefix "${RUNNER_OS_NAME}-cargo-registry-" "$REGISTRY_KEY"
          cleanup_prefix "${RUNNER_OS_NAME}-cargo-build-rust-" "$BUILD_KEY"
          cleanup_prefix "${RUNNER_OS_NAME}-xray-" "$XRAY_KEY"
          cleanup_prefix "${RUNNER_OS_NAME}-sing-box-" "$SINGBOX_KEY"
