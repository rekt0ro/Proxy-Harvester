name: Update Configs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load sources
        env:
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES }}
        run: |
          test -n "$PROXY_SOURCES"
          printf '%s\n' "$PROXY_SOURCES" > sources.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Cache Go build and module data
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-singbox-v1.14.2
          restore-keys: |
            ${{ runner.os }}-go-singbox-

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-singbox2proxy-0.3.4
          restore-keys: |
            ${{ runner.os }}-pip-singbox2proxy-

      - name: Cache sing-box binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sing-box
          key: ${{ runner.os }}-sing-box-v1.14.2-with_quic-with_wireguard-with_utls-with_clash_api-with_gvisor

      - name: Install proxy tester
        run: |
          python3 -m pip install --disable-pip-version-check 'singbox2proxy[socks]==0.3.4'
          mkdir -p "$HOME/.local/bin"

          if [ ! -x "$HOME/.local/bin/sing-box" ]; then
            git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box
            TAGS="with_quic with_wireguard with_utls with_clash_api with_gvisor" make
            install -m 0755 sing-box "$HOME/.local/bin/sing-box"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sing-box" version
          "$HOME/.local/bin/sing-box" version | grep -q '1.14.2' || {
            echo "Unexpected sing-box version"
            exit 1
          }
          "$HOME/.local/bin/sing-box" version | grep -q 'with_utls' || {
            echo "sing-box was built without with_utls"
            exit 1
          }

      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/check_proxies.py scripts/polish_light.py
          git diff --check

      - name: Check runner network
        run: |
          curl -fsS --max-time 10 https://cp.cloudflare.com/ -o /dev/null
          curl -fsS --max-time 10 https://api.ipify.org?format=json -o /dev/null

      - name: Preserve previous Light pool
        run: |
          mkdir -p /tmp/proxy-harvester
          if [ -s subscriptions/light.txt ]; then
            cp subscriptions/light.txt /tmp/proxy-harvester/previous-light.txt
          else
            : > /tmp/proxy-harvester/previous-light.txt
          fi

      - name: Build collector
        run: cargo build --release

      - name: Collect and TCP-test configs
        run: ./target/release/proxy-harvester

      - name: Build Light subscription
        run: |
          set +e
          python3 scripts/polish_light.py \
            --all subscriptions/all.txt \
            --seed /tmp/proxy-harvester/previous-light.txt \
            --output /tmp/proxy-harvester/light.next.txt \
            --checker scripts/check_proxies.py \
            --budget 5000 \
            --workers 24 \
            --batch-size 100 \
            --timeout 12 \
            --warm-timeout 5 \
            --target-verified 500 \
            --final-recheck-limit 500 \
            --final-workers 12 \
            --final-batch-size 1 \
            --primary-target http://cp.cloudflare.com/ \
            --secondary-target https://www.google.com/generate_204 \
            --selection-limit 200 \
            --max-per-endpoint 1 \
            --max-per-family 1
          status=$?
          set -e

          if [ -s /tmp/proxy-harvester/light.next.txt ]; then
            cp /tmp/proxy-harvester/light.next.txt subscriptions/light.txt
            echo "Published refreshed Light subscription."
          elif [ "$status" -ne 0 ]; then
            echo "Light validation did not produce a new verified pool; preserving the previous Light subscription."
          else
            echo "Light validation produced no configs; preserving the previous Light subscription."
          fi

      - name: Generate Base64 subscriptions
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          for name in ("all", "light"):
              path = Path("subscriptions") / f"{name}.txt"
              if not path.exists():
                  continue
              payload = path.read_bytes().rstrip(b"\r\n")
              encoded = base64.b64encode(payload).decode("ascii")
              (Path("subscriptions") / f"{name}-base64.txt").write_text(
                  encoded + "\n",
                  encoding="ascii",
              )
          PY

      - name: Clean generated temporary files
        if: always()
        run: |
          rm -rf /tmp/proxy-harvester
          rm -f subscriptions/.*.txt subscriptions/.*.json

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update subscriptions"
          git push
