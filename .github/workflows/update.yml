name: Update Configs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sing-box
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.12.4/sing-box-1.12.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-1.12.4-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Install sb2p
        run: |
          curl -fsSL https://raw.githubusercontent.com/nichind/singbox2proxy/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sb2p" --version

      - name: Build
        run: cargo build --release

      - name: Collect and test configs
        run: ./target/release/proxy-harvester

      - name: Commit changes
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          git add subscriptions/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update configs"
          git push
