name: Repository Maintenance

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: repository-maintenance
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare authenticated GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git

      - name: Refresh repository metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "rekt0ro"
          git config user.email "vultazhh@gmail.com"

          date_utc="$(date -u +%Y-%m-%d)"
          branch="maintenance/refresh-$(date -u +%Y%m%d-%H%M%S)"

          git switch -c "$branch"

          if grep -q '^Last repository maintenance:' README.md; then
            sed -i "s/^Last repository maintenance:.*/Last repository maintenance: $date_utc/" README.md
          else
            sed -i "/^## Disclaimer/i Last repository maintenance: $date_utc\n" README.md
          fi

          git add README.md

          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi

          git commit -m "Refresh repository metadata"
          git push --set-upstream origin "$branch"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Refresh repository metadata" \
            --body "Routine repository metadata refresh.")"

          gh pr merge "$pr_url" --squash --delete-branch
